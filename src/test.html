<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Card Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        
        .test-container {
            width: 350px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            transition: width 0.3s ease;
        }
        
        sidebar-card {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .controls {
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .controls h3 {
            color: white;
            margin-top: 0;
            grid-column: span 2;
        }
        
        .control-section {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 5px;
        }
        
        .control-section h4 {
            color: white;
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        
        .controls button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            margin: 3px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            display: block;
            width: calc(100% - 6px);
        }
        
        .controls button:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .width-slider {
            width: 100%;
            margin: 10px 0;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            height: 6px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .width-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        .width-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        .width-display {
            color: white;
            font-family: monospace;
            font-size: 12px;
            text-align: center;
            margin-top: 5px;
        }
        
        .debug-info {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            margin-top: 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h2 style="color: white; margin-bottom: 20px;">Sidebar Card Test</h2>
    
    <div class="test-container">
        <sidebar-card id="sidebarCard"></sidebar-card>
    </div>
    
    <div class="controls">
        <h3>Test Controls</h3>
        
        <div class="control-section">
            <h4>📐 Sidebar Width Config</h4>
            <input type="range" 
                   class="width-slider" 
                   id="widthConfigSlider"
                   min="15" 
                   max="50" 
                   value="25" 
                   oninput="updateWidthConfig(this.value)">
            <div class="width-display" id="widthConfigDisplay">Width Config: 25%</div>
            <button onclick="setWidthConfig(20)">Narrow (20%)</button>
            <button onclick="setWidthConfig(25)">Default (25%)</button>
            <button onclick="setWidthConfig(35)">Wide (35%)</button>
            <button onclick="testResponsiveWidth()">Test Responsive</button>
        </div>
        
        <div class="control-section">
            <h4>⚙️ Configuration Tests</h4>
            <button onclick="testBasicConfig()">Basic Config</button>
            <button onclick="testWithClock()">With Clock</button>
            <button onclick="testWithWeather()">With Weather</button>
            <button onclick="testFullConfig()">Full Config</button>
            <button onclick="testGlanceBar()">Glance Bar</button>
            <button onclick="clearConfig()">Clear</button>
        </div>

        <div class="control-section">
            <h4>🔦 Glance Bar State Toggles</h4>
            <button onclick="toggleState('light.living_room', 'on', 'off')">Toggle Living Room Light</button>
            <button onclick="toggleState('binary_sensor.front_door', 'on', 'off')">Toggle Front Door</button>
            <button onclick="toggleState('sun.sun', 'below_horizon', 'above_horizon')">Toggle Sun (day/night)</button>
            <button onclick="setAQI(30)">AQI: 30 (good)</button>
            <button onclick="setAQI(75)">AQI: 75 (warn)</button>
            <button onclick="setAQI(160)">AQI: 160 (bad)</button>
        </div>
    </div>
    
    <div class="debug-info" id="debugInfo">
        <strong>Debug Log:</strong><br>
        Waiting for sidebar-card.js to load...
    </div>

    <!-- ha-icon mock: shadow root per instance so MDI CSS works inside other shadow roots -->
    <script>
        customElements.define('ha-icon', class extends HTMLElement {
            constructor() {
                super();
                const root = this.attachShadow({ mode: 'open' });
                // Inject MDI font CSS into this shadow root — browser caches the file globally
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css';
                root.appendChild(link);
                this._span = document.createElement('span');
                root.appendChild(this._span);
            }
            static get observedAttributes() { return ['icon']; }
            connectedCallback() { this._render(); }
            attributeChangedCallback() { this._render(); }
            set icon(val) { this.setAttribute('icon', val); }
            get icon() { return this.getAttribute('icon') || ''; }
            _render() {
                if (!this._span) return;
                const name = (this.getAttribute('icon') || '').replace(/^mdi:/, '');
                // --mdc-icon-size inherits through shadow boundaries via CSS custom properties
                const size = getComputedStyle(this).getPropertyValue('--mdc-icon-size').trim() || '24px';
                this.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;';
                this._span.className = `mdi mdi-${name}`;
                this._span.style.fontSize = size;
                this._span.style.lineHeight = '1';
            }
        });
    </script>

    <!-- Import your existing sidebar card -->
    <script type="module" src="../dist/sidebar-card.js"></script>
    
    <!-- Fallback dependencies in case they're missing -->
    <script type="module">
        // Check if lit-element is available, if not provide fallback
        if (!window.LitElement) {
            console.log('Loading lit-element fallback...');
            import('https://unpkg.com/lit@3.0.0/index.js').then(module => {
                window.LitElement = module.LitElement;
                window.html = module.html;
                window.css = module.css;
                console.log('✅ Lit dependencies loaded');
            }).catch(e => console.error('❌ Failed to load Lit:', e));
        }
        
        // Mock card-tools if missing
        if (!window.moreInfo) {
            window.moreInfo = (entity) => console.log('Mock moreInfo called for:', entity);
        }
        if (!window.hass) {
            window.hass = () => mockHassData;
        }
        if (!window.provideHass) {
            window.provideHass = (element) => {
                if (element && mockHassData) {
                    element.hass = mockHassData;
                }
            };
        }
        if (!window.subscribeRenderTemplate) {
            window.subscribeRenderTemplate = () => console.log('Mock subscribeRenderTemplate called');
        }
        
        // Mock custom-card-helpers
        if (!window.forwardHaptic) {
            window.forwardHaptic = (type) => console.log('Mock haptic:', type);
        }
        if (!window.navigate) {
            window.navigate = (window, path) => console.log('Mock navigate to:', path);
        }
        if (!window.toggleEntity) {
            window.toggleEntity = (hass, entity) => console.log('Mock toggle:', entity);
        }
    </script>
    
    <!-- OR if it's in a different path, adjust accordingly: -->
    <!-- <script type="module" src="../path/to/your/sidebar-card.js"></script> -->
    
    <script>
        const debugEl = document.getElementById('debugInfo');

        // Overrides position:fixed and width:0 defaults that require the full HA DOM
        const testStyle = `
          .sidebar-inner {
            position: relative !important;
            width: 100% !important;
            height: 100% !important;
            top: 0 !important;
            overflow: auto !important;
          }
        `;

        function log(message) {
            console.log(message);
            const timestamp = new Date().toLocaleTimeString();
            debugEl.innerHTML += `<br>[${timestamp}] ${message}`;
            debugEl.scrollTop = debugEl.scrollHeight;
        }
        
        // Mock Home Assistant environment
        const mockHassData = {
            states: {
                'weather.home': {
                    state: 'sunny',
                    attributes: {
                        temperature: 22,
                        unit_of_measurement: '°C',
                        friendly_name: 'Home Weather',
                        humidity: 65,
                        pressure: 1013
                    }
                },
                'weather.openweathermap': {
                    state: 'partlycloudy',
                    attributes: {
                        temperature: 18,
                        unit_of_measurement: '°C',
                        friendly_name: 'OpenWeatherMap'
                    }
                },
                'light.living_room': {
                    state: 'on',
                    attributes: {
                        friendly_name: 'Living Room Light'
                    }
                },
                'light.bedroom': {
                    state: 'off',
                    attributes: {
                        friendly_name: 'Bedroom Light'
                    }
                },
                'sun.sun': {
                    state: 'below_horizon',
                    attributes: { friendly_name: 'Sun', next_rising: '', next_setting: '' }
                },
                'binary_sensor.front_door': {
                    state: 'on',
                    attributes: { friendly_name: 'Front Door', device_class: 'door' }
                },
                'binary_sensor.garage_door': {
                    state: 'off',
                    attributes: { friendly_name: 'Garage Door', device_class: 'garage_door' }
                },
                'sensor.air_quality_index': {
                    state: '75',
                    attributes: { friendly_name: 'Air Quality Index', unit_of_measurement: 'AQI' }
                }
            },
            language: 'en',
            callService: (domain, service, data) => {
                log(`Service called: ${domain}.${service} with data: ${JSON.stringify(data)}`);
            }
        };

        window.hass = () => mockHassData;

        // Mock other dependencies that might be needed
        window.customCards = window.customCards || [];
        
        // Mock moment if not available
        if (typeof window.moment === 'undefined') {
            window.moment = function(date) {
                const d = date ? new Date(date) : new Date();
                return {
                    locale: () => {},
                    format: (format) => {
                        if (format === 'DD MMMM') {
                            return d.toLocaleDateString('en-US', { 
                                day: '2-digit', 
                                month: 'long' 
                            });
                        }
                        if (format === 'dddd, MMMM DD') {
                            return d.toLocaleDateString('en-US', { 
                                weekday: 'long',
                                month: 'long', 
                                day: 'numeric' 
                            });
                        }
                        return d.toLocaleDateString();
                    }
                };
            };
        }
        
        // Current config state
        let currentConfig = {
            title: "Smart Home",
            digitalClock: true,
            date: true,
            weather: true,
            weatherEntity: "weather.home",
            width: 25,
            style: testStyle
        };
        
        // Width control functions
        function updateWidthConfig(widthPercent) {
            const widthConfigDisplay = document.getElementById('widthConfigDisplay');
            widthConfigDisplay.textContent = `Width Config: ${widthPercent}%`;
            
            // Update current config
            currentConfig.width = parseInt(widthPercent);
            
            // Apply to sidebar card
            const sidebarCard = document.getElementById('sidebarCard');
            if (sidebarCard && sidebarCard.setConfig) {
                sidebarCard.setConfig({...currentConfig});
                log(`📐 Sidebar width config changed to: ${widthPercent}% (${currentConfig.width})`);
            }
        }
        
        function setWidthConfig(widthPercent) {
            const slider = document.getElementById('widthConfigSlider');
            slider.value = widthPercent;
            updateWidthConfig(widthPercent);
        }
        
        function testResponsiveWidth() {
            log('🔄 Testing responsive width configuration...');
            const sidebarCard = document.getElementById('sidebarCard');
            if (sidebarCard && sidebarCard.setConfig) {
                const responsiveConfig = {
                    ...currentConfig,
                    width: {
                        desktop: 25,
                        tablet: 35,
                        mobile: 0  // Hidden on mobile
                    },
                    breakpoints: {
                        tablet: 1024,
                        mobile: 768
                    }
                };
                sidebarCard.setConfig(responsiveConfig);
                log('📱 Responsive width config applied: Desktop 25%, Tablet 35%, Mobile hidden');
            }
        }
        
        // Test functions
        function testBasicConfig() {
            log('Testing basic config...');
            currentConfig = {
                title: "My Home",
                width: currentConfig.width,
                style: testStyle
            };
            const sidebarCard = document.getElementById('sidebarCard');
            sidebarCard.setConfig(currentConfig);
        }
        
        function testWithClock() {
            log('Testing config with clock...');
            currentConfig = {
                title: "Smart Home",
                digitalClock: true,
                digitalClockWithSeconds: true,
                date: true,
                dateFormat: "dddd, MMMM DD",
                width: currentConfig.width,
                style: testStyle
            };
            const sidebarCard = document.getElementById('sidebarCard');
            sidebarCard.setConfig(currentConfig);
        }
        
        function testWithWeather() {
            log('Testing config with weather...');
            currentConfig = {
                title: "Weather Test",
                date: true,
                weather: true,
                weatherEntity: "weather.home",
                weatherFormat: "°C",
                width: currentConfig.width,
                style: testStyle
            };
            const sidebarCard = document.getElementById('sidebarCard');
            sidebarCard.setConfig(currentConfig);
        }
        
        function testFullConfig() {
            log('Testing full config...');
            currentConfig = {
                title: "Smart Home",
                digitalClock: true,
                digitalClockWithSeconds: false,
                date: true,
                dateFormat: "dddd, MMMM DD",
                weather: true,
                weatherEntity: "weather.home",
                width: currentConfig.width,
                style: testStyle,
                sidebarMenu: [
                    {
                        name: "Home",
                        icon: "mdi:home",
                        action: "navigate",
                        navigation_path: "/lovelace/0"
                    },
                    {
                        name: "Living Room Light",
                        icon: "mdi:lightbulb",
                        action: "toggle",
                        entity: "light.living_room",
                        state: "light.living_room"
                    },
                    {
                        name: "Bedroom Light",
                        icon: "mdi:lightbulb-outline",
                        action: "toggle",
                        entity: "light.bedroom",
                        state: "light.bedroom"
                    },
                    {
                        name: "Camera",
                        icon: "mdi:camera",
                        action: "navigate",
                        navigation_path: "/lovelace/cameras"
                    },
                    {
                        name: "Energy",
                        icon: "mdi:flash",
                        action: "navigate",
                        navigation_path: "/energy"
                    }
                ]
            };
            const sidebarCard = document.getElementById('sidebarCard');
            sidebarCard.setConfig(currentConfig);
        }
        
        function clearConfig() {
            log('Clearing config...');
            currentConfig = { width: currentConfig.width, style: testStyle };
            const sidebarCard = document.getElementById('sidebarCard');
            sidebarCard.setConfig(currentConfig);
        }

        function testGlanceBar() {
            log('Testing glance bar...');
            currentConfig = {
                title: "Smart Home",
                digitalClock: true,
                date: true,
                weather: true,
                weatherEntity: "weather.home",
                width: currentConfig.width,
                style: testStyle,
                sidebarMenu: [
                    { name: "Home", icon: "mdi:home", action: "navigate", navigation_path: "/lovelace/0" },
                    { name: "Lights", icon: "mdi:lightbulb", action: "navigate", navigation_path: "/lovelace/lights" },
                    { name: "Security", icon: "mdi:shield-home", action: "navigate", navigation_path: "/lovelace/security" }
                ],
                glanceBar: [
                    {
                        entity: 'light.living_room',
                        icon: 'mdi:lightbulb',
                        name: 'Living Room',
                        show: { condition: 'state', state: 'on' },
                        badge: { condition: 'sun_below_horizon', color: '#f59e0b', icon: 'mdi:alert-circle-outline' }
                    },
                    {
                        entity: 'binary_sensor.front_door',
                        icon: 'mdi:door-open',
                        name: 'Front Door',
                        show: { condition: 'state', state: 'on' },
                        badge: { condition: 'always', color: '#ef4444' }
                    },
                    {
                        entity: 'sensor.air_quality_index',
                        icon: 'mdi:air-filter',
                        name: 'Air Quality',
                        show: { condition: 'numeric_above', threshold: 50 },
                        badge: { condition: 'numeric_above', threshold: 100, color: '#ef4444', icon: 'mdi:skull-outline' }
                    }
                ]
            };
            const sidebarCard = document.getElementById('sidebarCard');
            sidebarCard.setConfig(currentConfig);
            sidebarCard.hass = mockHassData;
            log(`States: light=${mockHassData.states['light.living_room'].state}, door=${mockHassData.states['binary_sensor.front_door'].state}, sun=${mockHassData.states['sun.sun'].state}, aqi=${mockHassData.states['sensor.air_quality_index'].state}`);
        }

        function toggleState(entityId, stateA, stateB) {
            const current = mockHassData.states[entityId].state;
            mockHassData.states[entityId].state = current === stateA ? stateB : stateA;
            const sidebarCard = document.getElementById('sidebarCard');
            if (sidebarCard) sidebarCard.hass = Object.assign({}, mockHassData);
            log(`${entityId} → ${mockHassData.states[entityId].state}`);
        }

        function setAQI(value) {
            mockHassData.states['sensor.air_quality_index'].state = String(value);
            const sidebarCard = document.getElementById('sidebarCard');
            if (sidebarCard) sidebarCard.hass = Object.assign({}, mockHassData);
            log(`AQI → ${value}`);
        }
        
        // Wait for custom element to be defined
        let elementCheckCount = 0;
        const maxChecks = 10;
        
        function checkElement() {
            elementCheckCount++;
            log(`🔍 Check #${elementCheckCount}: Looking for sidebar-card...`);
            
            if (customElements.get('sidebar-card')) {
                log('✅ sidebar-card custom element found!');
                setupSidebarCard();
            } else if (elementCheckCount < maxChecks) {
                log('⏳ sidebar-card not ready yet, checking again in 1 second...');
                setTimeout(checkElement, 1000);
            } else {
                log('❌ sidebar-card not found after ' + maxChecks + ' attempts');
                log('💡 Troubleshooting steps:');
                log('   1. Check that sidebar-card.js is in the same directory');
                log('   2. Open browser console (F12) and look for error messages');
                log('   3. Try updating the script src path');
                log('   4. Check if your sidebar-card.js has any dependencies');
                
                // Try to show what custom elements ARE defined
                const definedElements = [];
                for (let name of customElements.getName ? customElements.getName() : []) {
                    definedElements.push(name);
                }
                if (definedElements.length > 0) {
                    log('📋 Other custom elements found: ' + definedElements.join(', '));
                } else {
                    log('📋 No custom elements found at all');
                }
            }
        }
        
        function setupSidebarCard() {
            const sidebarCard = document.getElementById('sidebarCard');
            if (sidebarCard) {
                log('🎯 Found sidebar card DOM element');
                
                // Check if it has the required methods
                if (typeof sidebarCard.setConfig === 'function') {
                    log('✅ setConfig method found');
                } else {
                    log('❌ setConfig method missing - component may not be fully loaded');
                }
                
                // Set up the card with mock hass
                sidebarCard.hass = mockHassData;
                log('✅ Mock hass data attached to sidebar card');
                
                // Try to inspect the shadow DOM
                setTimeout(() => {
                    if (sidebarCard.shadowRoot) {
                        log('✅ Shadow DOM found');
                        const innerHTML = sidebarCard.shadowRoot.innerHTML;
                        if (innerHTML.length > 0) {
                            log('✅ Shadow DOM has content (' + innerHTML.length + ' characters)');
                            log('🔍 First 200 chars: ' + innerHTML.substring(0, 200) + '...');
                        } else {
                            log('❌ Shadow DOM is empty');
                        }
                    } else {
                        log('❌ No shadow DOM found');
                    }
                }, 500);
                
                // Start with a basic test
                setTimeout(() => {
                    log('🚀 Starting with full config test...');
                    testFullConfig();
                }, 1000);
            } else {
                log('❌ Could not find sidebar-card DOM element');
            }
        }
        
        // Start checking
        setTimeout(checkElement, 500);
        
        // Additional error handling
        window.addEventListener('error', (e) => {
            log('❌ JavaScript Error: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        });
        
        setTimeout(() => {
            if (!customElements.get('sidebar-card')) {
                log('⚠️  sidebar-card not found after 3 seconds');
                log('💡 Check that sidebar-card.js is loading correctly');
                log('💡 Open browser console (F12) for more details');
            }
        }, 3000);
    </script>
</body>
</html>
